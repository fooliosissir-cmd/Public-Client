name: Publish current Burial Grounds clients

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-current-clients.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public downloads repo
        uses: actions/checkout@v4

      - name: Download verified build artifacts and publish direct client files
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_SOURCE='https://sdmntprcentralus.oaiusercontent.com/files/00000000-5810-81f5-ae3d-0921f533d537/raw?se=2026-09-29T19%3A31%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=cd4e27c8-4629-511a-9a74-bf8aa1e12450&skoid=3c9b86d7-60cb-496a-a3c1-90c5457c8da4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T14%3A40%3A49Z&ske=2026-09-30T14%3A40%3A49Z&sks=b&skv=2026-02-06&sig=ZuESh4Zz0ALmTPK0kSid3kN/cZhX2oMkKsJao10uyqM%3D'
          DESKTOP_SOURCE='https://sdmntprcentralus.oaiusercontent.com/files/00000000-32bc-81f5-a4ae-734bed3b77a0/raw?se=2026-09-29T19%3A31%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=ac836855-8001-5cbe-99e3-a90bd753711f&skoid=3c9b86d7-60cb-496a-a3c1-90c5457c8da4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T03%3A58%3A44Z&ske=2026-09-30T03%3A58%3A44Z&sks=b&skv=2026-02-06&sig=KJWL9u88OJKLuvgKjl/%2Bzy/UkZ9McPBxTf%2BZ2k%2BafNc%3D'

          mkdir -p Android Desktop updates/android-native .publish-tmp
          curl -fL "$ANDROID_SOURCE" -o .publish-tmp/android-artifact.zip
          curl -fL "$DESKTOP_SOURCE" -o .publish-tmp/desktop-artifact.zip

          unzip -p .publish-tmp/android-artifact.zip Darkan-Android-debug.apk > Android/BurialGrounds-Android-0.2.8-dev.apk
          unzip -p .publish-tmp/desktop-artifact.zip BurialGrounds-Desktop-Build7.zip > Desktop/BurialGrounds-Windows.zip

          echo "22f01aada2db5b3f5e59b06a9ef4809b73fe0ac2c3ae1fc85dc9315f0a97aa10  Android/BurialGrounds-Android-0.2.8-dev.apk" | sha256sum -c -
          echo "1e8f1b365a6c025872f8b694ec1aba91e5b0863a8614f78358c0ee3de04f8c2e  Desktop/BurialGrounds-Windows.zip" | sha256sum -c -

          printf '%s  %s\n'             '22f01aada2db5b3f5e59b06a9ef4809b73fe0ac2c3ae1fc85dc9315f0a97aa10'             'BurialGrounds-Android-0.2.8-dev.apk'             > Android/BurialGrounds-Android-0.2.8-dev.sha256

          printf '%s  %s\n'             '1e8f1b365a6c025872f8b694ec1aba91e5b0863a8614f78358c0ee3de04f8c2e'             'BurialGrounds-Windows.zip'             > Desktop/BurialGrounds-Windows.sha256

          cat > updates/android-native/manifest.json <<'JSON'
          {"versionCode":9,"versionName":"0.2.8-dev","apkUrl":"https://raw.githubusercontent.com/fooliosissir-cmd/Public-Client/main/Android/BurialGrounds-Android-0.2.8-dev.apk","apkSha256":"22f01aada2db5b3f5e59b06a9ef4809b73fe0ac2c3ae1fc85dc9315f0a97aa10","apkSize":2195080}
          JSON

          cat > Android/README.md <<'EOF'
          # Burial Grounds — Android

          Download the Android client directly as an APK:

          **BurialGrounds-Android-0.2.8-dev.apk**

          This is the current Darkan revision-727 Burial Grounds Android client. The APK itself is stored in this folder; players do **not** need to download or unpack a ZIP file.

          SHA-256: `22f01aada2db5b3f5e59b06a9ef4809b73fe0ac2c3ae1fc85dc9315f0a97aa10`
          EOF

          cat > Desktop/README.md <<'EOF'
          # Burial Grounds — Desktop

          Download the current Windows desktop client:

          **BurialGrounds-Windows.zip**

          This ZIP contains the current Burial Grounds Desktop Build 7 package.

          SHA-256: `1e8f1b365a6c025872f8b694ec1aba91e5b0863a8614f78358c0ee3de04f8c2e`
          EOF

          cat > README.md <<'EOF'
          # Burial Grounds — Downloads

          Current public client downloads:

          - **Android:** `Android/BurialGrounds-Android-0.2.8-dev.apk` — direct APK download, no ZIP required.
          - **Windows Desktop:** `Desktop/BurialGrounds-Windows.zip`

          These files are built from the current Darkan-based Burial Grounds client line.
          EOF

          rm -rf .publish-tmp
          rm -f .github/workflows/publish-current-clients.yml

      - name: Commit published clients
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Burial Grounds Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish current Android and desktop clients"
          git push
