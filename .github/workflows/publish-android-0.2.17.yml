name: Publish Android 0.2.17 Public

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-android-0.2.17.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-6524-81f6-9fe1-1b5e8978f4c1/raw?se=2026-09-30T12%3A05%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=d9f60b7f-407b-5789-8535-7b3899337f0b&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T11%3A22%3A18Z&ske=2026-10-01T11%3A22%3A18Z&sks=b&skv=2026-02-06&sig=jKENuo7ZfO52WrHOPtMZ%2BRqXb4nY1/OE79hr6yXBOMo%3D'
      TAG: android-v0.2.17-dev

    steps:
      - uses: actions/checkout@v4

      - name: Download verified client artifact
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o candidate.zip
          mkdir candidate
          unzip -q candidate.zip -d candidate
          test -f candidate/BurialGrounds-Android-0.2.17-dev.apk
          test -f candidate/BurialGrounds-Android-0.2.17-dev.apk.sha256
          test -f candidate/manifest.candidate.json
          cd candidate
          sha256sum -c BurialGrounds-Android-0.2.17-dev.apk.sha256

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG"             --target "${{ github.sha }}"             --title "Burial Grounds Android 0.2.17-dev"             --notes "Current Android development candidate. Adds renderer metrics and skips redundant full-frame GPU texture uploads when Android draws without a newly swapped native frame. Includes all prior input, menu, action-strip, UI-scale and updater work."             --prerelease             candidate/BurialGrounds-Android-0.2.17-dev.apk             candidate/BurialGrounds-Android-0.2.17-dev.apk.sha256             candidate/manifest.candidate.json
