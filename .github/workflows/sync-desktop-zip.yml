name: Sync Desktop ZIP into repository

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-desktop-zip.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download managed Windows launcher package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/fooliosissir-cmd/Public-Client/releases/download/desktop-fkeys-home-cw-2026-10-07/BurialGrounds-Desktop-EXE-Build7.zip'
          $dest = 'Desktop/BurialGrounds-Windows.zip'
          $expected = 'cccdb2d087cf8a5eda89d20ffca13df86e29dc7abca5a573f526a49e3d90f4aa'
          New-Item -ItemType Directory -Force -Path 'Desktop' | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $dest
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $dest).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "SHA-256 mismatch. Expected $expected but got $actual"
          }
          "$actual  BurialGrounds-Windows.zip" | Set-Content -LiteralPath 'Desktop/BurialGrounds-Windows.zip.sha256' -Encoding ascii

      - name: Commit managed desktop package
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'Desktop/BurialGrounds-Windows.zip' 'Desktop/BurialGrounds-Windows.zip.sha256'
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Desktop ZIP already matches the managed launcher release.'
            exit 0
          }
          git commit -m "Publish managed Windows launcher package [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
