name: Publish Android 0.2.15 Public

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-android-0.2.15.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-7118-81f6-b9bf-86408b5a94e4/raw?se=2026-09-30T11%3A45%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=6acf099b-43f0-596b-b4bc-626edc81a730&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T08%3A08%3A42Z&ske=2026-10-01T08%3A08%3A42Z&sks=b&skv=2026-02-06&sig=5CrJsNTnR2BSd3TNgkXGm6h2lpj9F2haqdKzM8ILThk%3D'
      TAG: android-v0.2.15-dev

    steps:
      - uses: actions/checkout@v4

      - name: Download verified client artifact
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o candidate.zip
          mkdir candidate
          unzip -q candidate.zip -d candidate
          test -f candidate/BurialGrounds-Android-0.2.15-dev.apk
          test -f candidate/BurialGrounds-Android-0.2.15-dev.apk.sha256
          test -f candidate/manifest.candidate.json
          cd candidate
          sha256sum -c BurialGrounds-Android-0.2.15-dev.apk.sha256

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG"             --target "${{ github.sha }}"             --title "Burial Grounds Android 0.2.15-dev"             --notes "Current Android development candidate built from the customized Burial Grounds client source. Includes the mobile input/menu/action-strip improvements plus persistent native logical-canvas UI profiles: Comfort (105%, phone default), Standard (100%), and More Scene (~91%). Hold the Burial Grounds strip header to cycle the profile for the next launch."             --prerelease             candidate/BurialGrounds-Android-0.2.15-dev.apk             candidate/BurialGrounds-Android-0.2.15-dev.apk.sha256             candidate/manifest.candidate.json
