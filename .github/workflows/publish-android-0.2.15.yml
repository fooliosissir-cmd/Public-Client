name: Publish Android 0.2.15 Public

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-android-0.2.15.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: 'https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-1528-820c-8ee4-f779bcca7b80/raw?se=2026-09-30T15%3A01%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=a3850bb3-06cd-5025-bee5-e2b03d91b7fb&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T13%3A21%3A12Z&ske=2026-10-01T13%3A21%3A12Z&sks=b&skv=2026-02-06&sig=CIlBMXYp1ZSCqUT7ZuuA/MtvQ2HoFyUUXNQ01G92GJQ%3D'
      TAG: android-v0.2.15-dev

    steps:
      - uses: actions/checkout@v4

      - name: Download verified client artifact
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o candidate.zip
          mkdir candidate
          unzip -q candidate.zip -d candidate
          test -f candidate/BurialGrounds-Android-0.2.15-dev.apk
          test -f candidate/BurialGrounds-Android-0.2.15-dev.apk.sha256
          test -f candidate/manifest.candidate.json
          cd candidate
          sha256sum -c BurialGrounds-Android-0.2.15-dev.apk.sha256

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG"             --target "${{ github.sha }}"             --title "Burial Grounds Android 0.2.15-dev"             --notes "Current Android development candidate built from the customized Burial Grounds client source. Adds persistent logical-canvas UI scale profiles: Comfort (105%, phone default), Standard (100%), and More Scene (~91%), while retaining the prior touch, context-menu, action-strip, geometry, and input-queue improvements. Device smoke testing is still required before stable promotion."             --prerelease             candidate/BurialGrounds-Android-0.2.15-dev.apk             candidate/BurialGrounds-Android-0.2.15-dev.apk.sha256             candidate/manifest.candidate.json
