name: Publish Windows client

on:
  push:
    branches: [ main ]
    paths:
      - "desktop-overlay/**"
      - ".github/workflows/publish-windows.yml"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public download repo
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Recreate the exact desktop source baseline
        run: |
          git clone --filter=blob:none https://github.com/JesseGuerrero/deep-wiki-darkan-client.git upstream
          cd upstream
          git checkout c0cc9a8267286d9b0595328ab4e35999f32c7584
          cd ..
          cp -a desktop-overlay/. upstream/

      - name: Build current Burial Grounds desktop client
        run: |
          cd upstream
          chmod +x gradlew
          ./gradlew --no-daemon clean shadowJar
          JAR="$(find build/libs -maxdepth 1 -type f -name 'darkan-client-shaded-*.jar' | head -n 1)"
          test -n "$JAR"
          mkdir -p ../package/BurialGrounds
          cp "$JAR" ../package/BurialGrounds/BurialGrounds-Client.jar

      - name: Add a private Windows Java runtime
        run: |
          curl -fL --retry 4 --retry-delay 3 \
            "https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jre/hotspot/normal/eclipse?project=jdk" \
            -o /tmp/jre.zip
          mkdir -p /tmp/jre
          unzip -q /tmp/jre.zip -d /tmp/jre
          JRE_DIR="$(find /tmp/jre -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$JRE_DIR"
          mv "$JRE_DIR" package/BurialGrounds/runtime

      - name: Add one-click launcher
        run: |
          cat > package/BurialGrounds/Start-Burial-Grounds.bat <<'BAT'
          @echo off
          cd /d "%~dp0"
          if exist "runtime\bin\javaw.exe" (
            start "" "runtime\bin\javaw.exe" -Xms512m -Xmx2048m -jar "BurialGrounds-Client.jar"
            exit /b 0
          )
          java -jar "BurialGrounds-Client.jar"
          pause
          BAT
          cat > package/BurialGrounds/README.txt <<'TXT'
          BURIAL GROUNDS - WINDOWS CLIENT

          1. Extract this ZIP.
          2. Double-click Start-Burial-Grounds.bat.
          3. Log in and choose Main World.

          A private Java 21 runtime is included, so a separate Java install is not required.
          This package is the public client only. It does not contain the game server.
          TXT

      - name: Create and verify public ZIP
        run: |
          mkdir -p downloads
          cd package
          zip -qr ../downloads/BurialGrounds-Windows-Latest.zip BurialGrounds
          cd ..
          unzip -t downloads/BurialGrounds-Windows-Latest.zip
          sha256sum downloads/BurialGrounds-Windows-Latest.zip > downloads/BurialGrounds-Windows-Latest.sha256
          test "$(stat -c%s downloads/BurialGrounds-Windows-Latest.zip)" -lt 100000000

      - name: Publish binary and remove temporary build source
        run: |
          rm -rf desktop-overlay
          rm -f .github/workflows/publish-windows.yml
          git config user.name "Burial Grounds Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish latest Windows client"
          git push
