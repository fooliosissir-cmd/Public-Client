name: Remove Withdrawn Android 0.2.11

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-withdrawn-android.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove withdrawn APK asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete-asset preview-2026-09-29 BurialGrounds-Android-0.2.11-dev.apk             --repo fooliosissir-cmd/Public-Client             --yes || true
