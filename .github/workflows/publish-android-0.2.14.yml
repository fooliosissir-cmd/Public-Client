name: Publish Android 0.2.14 Public

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-android-0.2.14.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-3cf4-81f6-a5fb-d4eb8bd52132/raw?se=2026-09-30T11%3A28%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=ee033470-b3bd-52af-9631-7b668bfa5554&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T10%3A55%3A23Z&ske=2026-10-01T10%3A55%3A23Z&sks=b&skv=2026-02-06&sig=0%2BuaUwgXhPjzenPl1/QgUyv8eLzOZexV1/MfOgc5n%2B8%3D'
      TAG: android-v0.2.14-dev

    steps:
      - uses: actions/checkout@v4

      - name: Download verified client artifact
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o candidate.zip
          mkdir candidate
          unzip -q candidate.zip -d candidate
          test -f candidate/BurialGrounds-Android-0.2.14-dev.apk
          test -f candidate/BurialGrounds-Android-0.2.14-dev.apk.sha256
          test -f candidate/manifest.candidate.json
          cd candidate
          sha256sum -c BurialGrounds-Android-0.2.14-dev.apk.sha256

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG"             --target "${{ github.sha }}"             --title "Burial Grounds Android 0.2.14-dev"             --notes "Current Android development candidate built from the customized Burial Grounds client source. Includes touch/input fixes, context-menu improvements, geometry/input synchronization, motion coalescing, and the Burial Grounds mobile side strip. Device smoke testing is still required before this is promoted as the stable public Android build."             --prerelease             candidate/BurialGrounds-Android-0.2.14-dev.apk             candidate/BurialGrounds-Android-0.2.14-dev.apk.sha256             candidate/manifest.candidate.json
