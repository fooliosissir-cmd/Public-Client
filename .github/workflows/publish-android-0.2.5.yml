name: Publish Android 0.2.5

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/publish-android-0.2.5.yml"

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out public download repo
        uses: actions/checkout@v4

      - name: Download the verified 0.2.5 Android build
        env:
          APK_ZIP_URL: "https://sdmntpreastus2.oaiusercontent.com/files/00000000-d8dc-81f6-be17-7036b0c46a73/raw?se=2026-09-29T10%3A00%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=9f493e2b-d426-57bf-91ff-67d80927cbc2&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T07%3A27%3A06Z&ske=2026-09-30T07%3A27%3A06Z&sks=b&skv=2026-02-06&sig=UgyIcrfQ4MANU7qAcWUGOOiyxJiMm/4J90YAr8wy/Aw%3D"
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 "$APK_ZIP_URL" -o /tmp/BurialGrounds-Android-v0.2.5.zip
          rm -rf /tmp/bg-apk
          mkdir -p /tmp/bg-apk
          unzip -q /tmp/BurialGrounds-Android-v0.2.5.zip -d /tmp/bg-apk
          test -f /tmp/bg-apk/Darkan-Android-debug.apk
          echo "d66572b0382471eecb63ea47e7686f45e9995828e4bf8acb1417346fd55c1785  /tmp/bg-apk/Darkan-Android-debug.apk" | sha256sum -c -

      - name: Publish Android downloads
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp /tmp/bg-apk/Darkan-Android-debug.apk downloads/BurialGrounds-Android-v0.2.5.apk
          cp /tmp/bg-apk/Darkan-Android-debug.apk downloads/BurialGrounds-Android-Latest.apk
          sha256sum downloads/BurialGrounds-Android-v0.2.5.apk > downloads/BurialGrounds-Android-v0.2.5.sha256
          sha256sum downloads/BurialGrounds-Android-Latest.apk > downloads/BurialGrounds-Android-Latest.sha256
          test "$(stat -c%s downloads/BurialGrounds-Android-Latest.apk)" -eq 2187420

      - name: Commit exact verified APK
        run: |
          rm -f .github/workflows/publish-android-0.2.5.yml
          git config user.name "Burial Grounds Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish verified Burial Grounds Android 0.2.5"
          git push
